schema: conductivity_mixture_closure_record_v1
species:
- EC
- DMC
- EMC
- DEC
- PC
- FEC
- VC
- PS
- TPP
- Li+
- PF6-
- FSI-
- TFSI-
- DFOB-
- LiDFOB
reference_density_kg_m3: 1256.090909090909
dielectric:
  mixing_rule: solvent_volume_fraction_linear_static_dielectric
  pure_dielectric_source: data.species_data epsilon_r
  ownership: solvent_matrix_reference_only
viscosity:
  mixing_rule: solvent_reciprocal_volume_fraction
  pure_viscosity_source: data.species_data viscosity_cP
  ownership: solvent_matrix_reference_only
mobility:
  resistance_terms:
  - Stokes
  - free_volume
  - charge_cloud
  - atmosphere
  free_volume_exponent: 2.0
packing:
  local_volume_source: species_record_site_volumes
  invalid_state_rule: local_packing_fraction_must_remain_below_configured_phi_max
  phi_max: 0.64
  phi_max_source: random_close_packing_reference_for_site_volume_free_volume_closure
atmosphere:
  charge_sites_source: species_record_sites
  screening_source: composition_ionic_strength_and_mixture_dielectric
  response_model: finite_wavevector_pnp_stokes
  maximum_wavevector_integer: 2
  provenance: linearized_pnp_stokes_debye_falkenhagen
  fitted_to_conductivity: false
local_fields:
  dielectric_decrement_per_mol_m3: 0.002
  jones_dole_A_sqrt_m3_mol: 0.003
  jones_dole_B_m3_mol: 1.0e-05
  local_ionic_strength_packing_coupling: 1.0
  packing_viscosity_exponent: 2.0
property_ownership:
  dielectric:
    bulk: solvent_matrix_reference
    local: ionic_strength_decrement
  viscosity:
    bulk: solvent_matrix_reference
    local: Jones_Dole_packing_and_state_additive_microviscosity
  additive_properties:
    bulk: excluded
    local: state_configuration_occupancy
parameter_provenance:
  dielectric.pure_dielectric_source: measured_pure_property
  viscosity.pure_viscosity_source: measured_pure_property
  mobility.free_volume_exponent: continuum_theory
  packing.phi_max: measured_pure_property
  local_fields.dielectric_decrement_per_mol_m3: measured_mixture_property
  local_fields.jones_dole_A_sqrt_m3_mol: measured_mixture_property
  local_fields.jones_dole_B_m3_mol: measured_mixture_property
  local_fields.local_ionic_strength_packing_coupling: continuum_theory
  local_fields.packing_viscosity_exponent: continuum_theory
